[project]
name = "llm-engineering-playground"
version = "0.1.0"
description = "Experiment with models, prompts, parameters, latency, and cost — and see the tradeoffs as numbers."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.37",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "ai-core @ git+https://github.com/ashutosh3060/ai-core.git@v0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
# MLflow is heavy and only needed to mirror runs into an experiment tracker;
# the SQLite store is the source of truth either way.
tracking = ["mlflow>=2.14"]

[project.scripts]
playground = "playground.cli:app"

# Required for the `ai-core @ git+...` dependency: hatchling rejects direct
# URL references unless explicitly allowed.
[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mlflow.*", "streamlit.*", "pandas.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
